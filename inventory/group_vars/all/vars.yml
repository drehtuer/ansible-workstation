---
# Repository-wide variables.
#
# Nothing personal lives here or anywhere else in this repository: it is a
# public blueprint, and git identity, signing keys and every other personal
# setting belong to the dotfiles repository that chezmoi applies.

# The account the docker and kvm roles add to their groups: by default the
# one the playbook runs as, which is the login account -- the playbook runs
# unprivileged and uses sudo per task.  Override with
# -e workstation_user=<account>.
workstation_user: "{{ ansible_user_id }}"

# Windows-side configuration is opt-in and never part of a default run.
manage_windows: false

# Which optional role groups to run.
enable_python: true
enable_network: true
enable_android: true
enable_browser: true
enable_kvm: true
enable_chezmoi: true
enable_editor: true
enable_docker: true
enable_fonts: true
enable_nodejs: true
enable_claude: true
