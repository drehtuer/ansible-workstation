[defaults]
inventory            = inventory/hosts.py
roles_path           = roles
collections_path     = .ansible/collections
interpreter_python   = auto_silent
# community.general.yaml was removed in v12; the default callback does this now.
result_format        = yaml
display_skipped_hosts = false
nocows               = true
retry_files_enabled  = false
# Facts are read as ansible_facts.<name>, never as top-level ansible_<name>
# variables.  That injection is deprecated and goes away in ansible-core
# 2.24; turning it off now makes any leftover use fail as undefined rather
# than warn.
inject_facts_as_vars = false

[privilege_escalation]
become_ask_pass = false

[ssh_connection]
pipelining = true
