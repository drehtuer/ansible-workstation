[defaults]
inventory            = inventory/hosts.py
roles_path           = roles
collections_path     = .ansible/collections
interpreter_python   = auto_silent
# community.general.yaml was removed in v12; the default callback does this now.
result_format        = yaml
display_skipped_hosts = false
nocows               = true
retry_files_enabled  = false

# vault_password_file is NOT configured here on purpose.
#
# A missing password file named here makes *every* command fail, including lint
# and syntax checks on a fresh clone and in CI, where no password exists at all.
# Instead, `tasks.py` appends --vault-password-file only when
# ~/.config/ansible/vault_pass is actually present.
#
# Never put a password, or a path inside this repository, in this file.

[privilege_escalation]
become_ask_pass = false

[ssh_connection]
pipelining = true
