---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans every commit, not only the newest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks is not on PyPI, so it comes from the Ubuntu archive; the
      # rest of the lint toolchain is locked in uv.lock.
      - name: Install gitleaks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gitleaks

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Exactly the tasks a developer runs locally -- there is no
      # CI-only command.
      - run: uv run invoke setup
      - run: uv run invoke lint
      - run: uv run invoke syntax

  site:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # Full history, so the release tags are present and this builds every
      # version the pages workflow would publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      # yamllint disable-line rule:line-length
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0"

      # kramdoc converts the Markdown pages during the site build.
      - run: gem install kramdown-asciidoc -v 2.1.1

      # Builds the Antora site.  A broken xref fails here, before the
      # pages workflow tries to publish it.
      - run: uv run invoke site

  converge:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["26.04", "24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # The whole playbook, twice; the second pass must change nothing.
      - run: uv run invoke converge --ubuntu ${{ matrix.ubuntu }}
