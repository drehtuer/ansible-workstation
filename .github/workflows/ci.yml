---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Exactly the tasks a developer runs locally -- there is no
      # CI-only command.
      - run: uv run invoke setup
      - run: uv run invoke lint
      - run: uv run invoke syntax

  converge:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No vault password exists here, by design.  Tasks tagged 'secrets' are
      # skipped and tests/vars.ci.yml supplies obviously-fake values instead.
      - run: uv run invoke converge --ubuntu ${{ matrix.ubuntu }}
