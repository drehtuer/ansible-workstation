---
- name: Install git, git-lfs and the forge CLIs
  become: true
  ansible.builtin.apt:
    name: "{{ git_packages }}"
    state: present

# The global half of `git lfs install`, without a command that reports
# changed on every run.  Not secret, so it runs in CI as well.
- name: Register the git-lfs filters
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ git_lfs_config }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'git-lfs' in git_packages"

- name: Configure git identity
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - {name: "user.name", value: "{{ git_user_name }}"}
    - {name: "user.email", value: "{{ git_user_email }}"}
    - {name: "init.defaultBranch", value: "{{ git_default_branch }}"}
    - {name: "core.editor", value: "{{ git_editor }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [secrets]

- name: Configure the git signing key
  community.general.git_config:
    name: user.signingkey
    scope: global
    value: "{{ git_signing_key }}"
  when: git_signing_key | length > 0
  no_log: true
  tags: [secrets]
