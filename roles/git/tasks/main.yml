---
- name: Install the deb822 apt source support
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Ensure the apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: "{{ git_gh_keyring | dirname }}"
    state: directory
    mode: "0755"

- name: Install the GitHub CLI signing keyring
  become: true
  ansible.builtin.copy:
    src: "{{ git_gh_key_file }}"
    dest: "{{ git_gh_keyring }}"
    mode: "0644"

- name: Add the GitHub CLI repository
  become: true
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: "{{ git_gh_repo_uri }}"
    suites: "{{ git_gh_repo_suite }}"
    components: [main]
    signed_by: "{{ git_gh_keyring }}"
    state: present

- name: Prefer GitHub's repository over the archive for gh
  become: true
  ansible.builtin.template:
    src: github-cli.pref.j2
    dest: /etc/apt/preferences.d/github-cli.pref
    mode: "0644"

# No cache_valid_time: the source above may have just been added, and a
# merely recent cache would not know about it.
- name: Install git, git-lfs and the forge CLIs
  become: true
  ansible.builtin.apt:
    name: "{{ git_packages }}"
    state: present
    update_cache: true

# The global half of `git lfs install`, without a command that reports
# changed on every run.  Not secret, so it runs in CI as well.
- name: Register the git-lfs filters
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ git_lfs_config }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'git-lfs' in git_packages"

- name: Configure git identity
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - {name: "user.name", value: "{{ git_user_name }}"}
    - {name: "user.email", value: "{{ git_user_email }}"}
    - {name: "init.defaultBranch", value: "{{ git_default_branch }}"}
    - {name: "core.editor", value: "{{ git_editor }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [secrets]

- name: Configure the git signing key
  community.general.git_config:
    name: user.signingkey
    scope: global
    value: "{{ git_signing_key }}"
  when: git_signing_key | length > 0
  no_log: true
  tags: [secrets]
