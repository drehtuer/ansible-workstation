---
# The environment variable is set by WSL in every login shell, and
# WSLInterop is registered only inside WSL.  A container running on a WSL
# host shares its kernel but has neither, so the checks stay out of it.
- name: Run the WSL health checks
  ansible.builtin.include_tasks:
    file: check.yml
    apply:
      tags: [wsl_check]
  when: >-
    ansible_env.WSL_DISTRO_NAME is defined
    or '/proc/sys/fs/binfmt_misc/WSLInterop' is exists
  tags: [wsl_check]

- name: Configure /etc/wsl.conf
  become: true
  community.general.ini_file:
    path: /etc/wsl.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
    no_extra_spaces: true
  loop:
    - section: network
      option: hostname
      value: "{{ wsl_hostname }}"
    - section: boot
      option: systemd
      value: "{{ wsl_systemd_enabled | lower }}"
    - section: interop
      option: appendWindowsPath
      value: "{{ wsl_append_windows_path | lower }}"
    - section: automount
      option: options
      value: "{{ wsl_automount_options }}"
  loop_control:
    label: "{{ item.section }}.{{ item.option }}"
  notify: Report wsl.conf change
