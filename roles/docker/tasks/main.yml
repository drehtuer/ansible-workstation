---
- name: Install docker packages
  become: true
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

# The file belongs to the administrator, not to this role: it is read,
# amended and written back, so a setting put there by hand survives.  It has
# to be valid JSON, which docker requires of it anyway.
- name: Configure the docker daemon MTU
  when: docker_daemon_mtu | int > 0
  become: true
  block:
    - name: Read the current daemon configuration
      ansible.builtin.slurp:
        src: "{{ docker_daemon_config }}"
      register: docker_daemon_current
      failed_when: false

    - name: Set the MTU, leaving the rest of the file as it was
      vars:
        current: >-
          {{ docker_daemon_current.content | b64decode | from_json
             if docker_daemon_current.content is defined else {} }}
      ansible.builtin.copy:
        # `>` rather than `>-`: the file ends with a newline like any other.
        content: >
          {{ current | combine({"mtu": docker_daemon_mtu | int})
             | to_nice_json }}
        dest: "{{ docker_daemon_config }}"
        mode: "0644"
      notify: Restart docker

- name: Read the local accounts
  ansible.builtin.getent:
    database: passwd
  when: docker_manage_group | bool
  tags: [secrets]

# `select` drops empty entries, so a machine with no vault of its own fails
# here instead of being skipped silently.  The message names the host, never
# the account.
- name: Assert that this host has an account name in the vault
  ansible.builtin.assert:
    that:
      - docker_users | select | list | length == docker_users | length
    fail_msg: >-
      No vault_workstation_user for {{ ansible_hostname }}. Create this
      machine's vault with `invoke vault-init --host`; see README,
      "Values that differ per machine".
  when: docker_manage_group | bool
  tags: [secrets]

# ansible.builtin.user creates an account that does not exist yet, which for
# a mistyped or stale vault entry would mean a brand new user rather than an
# error.  This role only ever adds an existing account to a group.
- name: Assert that those accounts exist on this machine
  ansible.builtin.assert:
    that:
      - docker_users | difference(ansible_facts.getent_passwd | list) |
        length == 0
    fail_msg: >-
      vault_workstation_user names an account that does not exist on
      {{ ansible_hostname }}. Fix it with `invoke vault-edit --host`, or
      create the account first -- this role never creates one.
  when: docker_manage_group | bool
  tags: [secrets]

- name: Add the user account to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ docker_group }}"
    append: true
  loop: "{{ docker_users }}"
  when: docker_manage_group | bool
  no_log: true
  tags: [secrets]

# WSL runs systemd only when /etc/wsl.conf enables it, and the converge
# container runs no init at all, so this is conditional rather than assumed.
- name: Enable the docker service
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
  when: ansible_service_mgr == "systemd"
