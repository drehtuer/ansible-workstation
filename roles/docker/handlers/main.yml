---
# Only where systemd is the init system: WSL runs it when /etc/wsl.conf says
# so, and the converge container runs no init at all.  Elsewhere the new MTU
# applies the next time the daemon starts.
- name: Restart docker
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: ansible_service_mgr == "systemd"
