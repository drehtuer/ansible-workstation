---
# Claude Code, from Anthropic's native installer.
#
# The Ubuntu archive does not ship it.  Anthropic offers three channels:
# the native installer, an apt repository, and an npm package.  The native
# installer is the one Anthropic recommends, and the one Claude Code's own
# updater and `claude doctor` expect: a self-contained binary in the login
# user's home, under ~/.local/share/claude, with a launcher at
# ~/.local/bin/claude, which updates itself in the background on the
# channel it was installed from.  npm stays out for the reason in the
# nodejs role: it would be a root-owned global install.
#
# The installer is run once, as the user the playbook runs as -- never with
# become, which the installer refuses -- and only while the launcher is
# missing.  After that, keeping Claude Code current is its own updater's
# job, not the playbook's: a re-run finds the launcher and changes nothing.
# The installer checks the binary it downloads against the SHA-256 in the
# release manifest before running it.
#
# Two channels exist.  `stable` serves a release about a week old and skips
# ones with major regressions; `latest` serves every release as it ships.
# The role passes the channel only on the first install; after that it is
# Claude Code's own setting, `autoUpdatesChannel`.
claude_channel: stable
claude_installer_url: https://claude.ai/install.sh
claude_launcher: "{{ ansible_env.HOME }}/.local/bin/claude"
claude_download_dir: "{{ ansible_env.HOME }}/.claude/downloads"
