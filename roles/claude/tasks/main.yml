---
# The installer downloads with curl or wget; base installs both, but
# `--tags claude` should work on its own.
- name: Install the downloader the Claude Code installer needs
  become: true
  ansible.builtin.apt:
    name: curl
    state: present

- name: Look for the Claude Code launcher
  ansible.builtin.stat:
    path: "{{ claude_launcher }}"
  register: claude_installed

# Not become: the installer works in $HOME and refuses to run under sudo.
- name: Install Claude Code with the native installer
  when: not claude_installed.stat.exists
  block:
    - name: Create the Claude Code download directory
      ansible.builtin.file:
        path: "{{ claude_download_dir }}"
        state: directory
        mode: "0700"

    - name: Download the Claude Code installer
      ansible.builtin.get_url:
        url: "{{ claude_installer_url }}"
        dest: "{{ claude_download_dir }}/install.sh"
        mode: "0700"

    - name: Run the Claude Code installer, channel {{ claude_channel }}
      ansible.builtin.command:
        argv:
          - bash
          - "{{ claude_download_dir }}/install.sh"
          - "{{ claude_channel }}"
        creates: "{{ claude_launcher }}"

    - name: Remove the Claude Code installer
      ansible.builtin.file:
        path: "{{ claude_download_dir }}/install.sh"
        state: absent
